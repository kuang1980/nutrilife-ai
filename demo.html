 if(action==='conflict'&&s.stage==='planned'){n.stage='conflict';n.events.push('11:45 · Demo meeting added: 12:30–13:30');}
 if(action==='select'&&s.stage==='conflict'&&alternatives(s).some(m=>m.id===value))n.selected=value;

 if(action==='log'&&['approved','reminded'].includes(s.stage)&&['satisfied','hungry','too-much'].includes(value)){n.stage='logged';n.logged.push(s.lunch);n.feedback=value;n.events.push('12:20 · Lunch logged; feedback: '+value);}

function agent(){let content='';const s=state.stage;
if(s==='planned')content=`<span class="tag">YOUR DAY, IN SYNC</span><h2>A good plan makes<br>room for real life.</h2><p>Your lunch is planned for 12:30. Let’s see how NutriLife adapts when your workday changes.</p><div class="meeting"><span>▦</span><div><strong>Product strategy meeting</strong><small>Demo event · 12:30–13:30</small></div></div><button class="primary light" data-action="conflict">Simulate meeting conflict <span>→</span></button><small class="hint">You’re in control. No plan changes without approval.</small>`;
if(s==='conflict'){const opts=alternatives(state);content=`<span class="tag orange">SCHEDULE CONFLICT DETECTED</span><h2>Busy day.<br>Lunch is still on.</h2><p>Your 12:30 meeting overlaps lunch. You have 20 minutes at 12:10. These options fit, using ready-to-eat ingredients.</p><div class="options">${opts.map(m=>`<button class="option ${state.selected===m.id?'chosen':''}" data-action="select" data-value="${m.id}" aria-pressed="${state.selected===m.id}"><span class="radio">${state.selected===m.id?'●':'○'}</span><span><strong>${m.name}</strong><small>${m.minutes} min · ≈ ${m.kcal} kcal · ${m.protein}g protein</small><small>${m.fiber}g fiber · Allergens: ${m.allergens.join(', ')||'none in fixture'}</small></span></button>`).join('')}</div><p class="reason">${state.selected==='wrap'?'Why this fits: chickpeas add protein and fiber; a whole-grain wrap and vegetables keep variety. Saves 22 minutes.':'Why this fits: lentils, whole grains and vegetables bring protein, fiber and variety. Saves 24 minutes.'}</p><button class="primary light" data-action="approve" ${!opts.length?'disabled':''}>Approve swap & update plan <span>✓</span></button><button class="text-button" data-action="decline">Keep my original lunch</button>`;}
if(['approved','reminded'].includes(s))content=`<span class="tag">✓ APPROVED BY YOU</span><h2>Lunch, reworked.<br>Day, back on track.</h2><p>${meals[state.lunch].name} is now at <strong>12:10</strong>. Your in-app reminder moved from 12:25 to <strong>12:05</strong>.</p><div class="meeting"><span>◷</span><div><strong>${s==='reminded'?'It’s time to take your lunch break.':'Your next gentle nudge'}</strong><small>${s==='reminded'?'Demo clock advanced to 12:05':'12:05 · Make space for a quick, nourishing lunch'}</small></div></div>${s==='approved'?'<button class="secondary on-dark" data-action="remind">Preview 12:05 reminder</button>':''}<button class="primary light" data-action="open-log">I’ve had lunch · log meal <span>→</span></button><small class="hint">Reminder is simulated in-app. No device notification sent.</small>`;

function plan(){return `<div class="page-heading"><div><div class="eyebrow">YOUR FLEXIBLE SCHEDULE</div><h1>A day with breathing room.</h1><p>Wednesday, October 28 · Synthetic calendar and meal plan</p></div></div><div class="plan-grid"><section class="card"><h2>Today’s timeline</h2>${[['08:00','Breakfast','Berry overnight oats'],...(state.stage==='planned'?[]:[['12:30–13:30','Work meeting','Product strategy · synthetic event']]),[isSwapped()?'12:10':'12:30','Lunch',meals[state.lunch].name],['15:30','Snack',meals.snack.name],['19:00','Dinner',meals.dinner.name]].sort((a,b)=>a[0].localeCompare(b[0])).map(([time,label,name])=>`<div class="timeline"><time>${time}</time><div><small>${label}</small><strong>${name}</strong></div></div>`).join('')}<div class="reminder"><strong>◷ Lunch reminder · ${state.reminder}</strong><p>Local demo schedule only. ${isSwapped()?'Updated after your approval.':'Original reminder.'}</p></div></section>${agent()}</div><section class="card audit"><h2>What changed, and why</h2><p>Every action stays visible.</p>${state.events.length?`<ol>${state.events.map(e=>`<li>${esc(e)}</li>`).join('')}</ol>`:'<p>No changes yet. Simulate the meeting to start.</p>'}</section>`;}
function insights(){const t=totals(state),energy=t.protein*4+t.carbs*4+t.fat*9;return `<div class="page-heading"><div><div class="eyebrow">NOTICE THE SMALL WINS</div><h1>Your day, taking shape.</h1><p>Only logged meals count here. Planned food is never counted as eaten.</p></div></div>${stats()}<div class="plan-grid"><section class="card"><span class="eyebrow">ESTIMATED ENERGY DISTRIBUTION</span><h2>Variety, in perspective.</h2>${[['Carbohydrate',t.carbs*4,'45–65%'],['Protein',t.protein*4,'10–35%'],['Fat',t.fat*9,'20–35%']].map(([name,kcal,range])=>`<div class="macro"><div><strong>${name}</strong><span>${Math.round(kcal/energy*100)}% of logged macro energy</span></div><div class="bar"><span style="width:${kcal/energy*100}%"></span></div><small>Adult AMDR reference: ${range} of energy</small></div>`).join('')}<p class="fine">Partial-day distribution is descriptive, not an adequacy assessment. Macro-derived energy can differ from listed calories because of rounding and fiber.</p></section><section class="card soft"><span class="eyebrow">GUIDELINES WITH CONTEXT</span><h2>Numbers need nuance.</h2><p>Dietary Reference Intakes (DRIs) include different kinds of reference values. RDA and AI are amounts tied to life stage. AMDR is a range of energy percentages.</p><p>A single meal or incomplete day cannot diagnose deficiency. This demo does not set personal calorie or micronutrient targets.</p><button class="secondary" data-action="guidelines">Read nutrition boundaries ↗</button><div class="feedback-summary"><strong>Lunch check-in</strong><p>${state.feedback?({satisfied:'Comfortably satisfied',hungry:'Still a little hungry','too-much':'A little too full'}[state.feedback]):'Your feedback will appear after lunch is logged.'}</p></div></section></div>`;}
function profile(){return `<div class="page-heading"><div><div class="eyebrow">ALEX MORGAN · FICTIONAL PERSONA</div><h1>Built around your real life.</h1><p>Adult office worker · Plant-forward meals · 20-minute lunch window</p></div></div><div class="plan-grid"><section class="card"><h2>Demo food exclusions</h2><p>Filter proposed swaps by fixture ingredient tags. Labels are illustrative; cross-contact and real ingredient verification are not covered.</p><fieldset ${isSwapped()?'disabled':''}><legend>Exclude from suggestions</legend>${['wheat','sesame','milk','tree nuts','soy'].map(a=>`<label class="check"><input type="checkbox" data-allergen="${a}" ${state.excluded.includes(a)?'checked':''}>${a}</label>`).join('')}</fieldset><p class="fine">${isSwapped()?'Restart the demo to change exclusions before approval.':'Changes affect proposed swaps only. The seeded daily menu is not allergy-validated.'}</p></section><section class="card"><h2>Your data stays here.</h2><p>This prototype uses synthetic data and a deterministic rules engine. It does not connect to a calendar, food service, wearable, clinician, or AI API.</p><p>${storage?'Demo progress is saved in this browser.':'Browser storage is unavailable. Progress lasts for this session.'} Reset clears the demo state.</p><button class="secondary" data-action="export">Export demo progress</button><button class="danger" data-action="reset">Reset demo & local progress</button></section></div>`;}
function render(){document.querySelector('#app').innerHTML=`<header><a class="brand" href="#today" aria-label="NutriLife AI home"><span class="brand-icon">❧</span>NutriLife<span class="ai">AI</span></a><nav aria-label="Main navigation">${Object.keys(icons).map(id=>`<button data-action="nav" data-value="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}><span>${icons[id]}</span>${({today:'Today',plan:'My plan',insights:'Insights',profile:'Preferences'})[id]}</button>`).join('')}</nav><div class="header-right"><span class="local-label"><i></i> Local demo</span><span class="avatar" aria-label="Alex Morgan fictional profile">AM</span></div></header><div class="demo-bar"><span><strong>PARTNER PREVIEW</strong> Synthetic data · Guided scenario · No external services</span><button data-action="reset">↻ Reset demo</button></div>${!storage?'<div class="storage-warning" role="status">Storage unavailable. Demo continues in memory; keep this tab open.</div>':''}<main id="main">${({today,plan,insights,profile})[view]()}</main><footer><a class="brand small" href="#today">❧ NutriLife AI</a><span>Make room for feeling good.</span><button data-action="guidelines">Demo & nutrition boundaries</button></footer>`;}
function modal(html){document.querySelector('#dialog-content').innerHTML=html;document.querySelector('#detail').showModal();}
document.querySelector('#close-dialog').onclick=()=>document.querySelector('#detail').close();
document.addEventListener('change',e=>{if(e.target.dataset.allergen)act('allergen',e.target.dataset.allergen);});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;
 if(a==='nav'){view=v;render();window.scrollTo({top:0,behavior:'smooth'});return;}
 if(a==='reset'){state=initial();view='today';save();render();notify('Demo reset. Ready for your next walkthrough.');return;}
 if(a==='meal'){const m=meals[v];modal(`<span class="eyebrow">SYNTHETIC MEAL ESTIMATE</span><h2>${m.name}</h2><p>${m.detail}</p><p>${m.minutes} minutes using prepared ingredients · ≈ ${m.kcal} kcal</p><div class="nutrition-list"><span>Protein <strong>${m.protein}g</strong></span><span>Carbohydrate <strong>${m.carbs}g</strong></span><span>Fat <strong>${m.fat}g</strong></span><span>Fiber <strong>${m.fiber}g</strong></span></div><p>Fixture allergens: ${m.allergens.join(', ')||'none tagged'}. These are not verified allergy-safe recipes.</p><p class="fine">Illustration only. Nutrition is hand-authored demo data, not a measured analysis.</p>`);return;}
 if(a==='guidelines'){modal('<span class="eyebrow">GENERAL WELLNESS DEMO</span><h2>Support, with boundaries.</h2><p>Not medical advice, diagnosis, treatment, or a clinical nutrition plan. No supplement dosing, deficiency diagnosis, restrictive compensation, or automatic meal changes.</p><p>DRI is an umbrella framework. RDA, AI, EAR and UL have distinct meanings; AMDR expresses a percent-of-energy range. RDA/AI amounts vary by age, sex and life stage. A UL is a safety limit, not a target.</p><p>Adult AMDR reference ranges: carbohydrate 45–65%, protein 10–35%, fat 20–35%. These do not certify that an individual meal or partial day is adequate.</p><p>Children, pregnancy/lactation, eating-disorder concerns and condition-specific diets need qualified professional support outside this prototype.</p><p><a href="https://www.canada.ca/en/health-canada/services/food-nutrition/healthy-eating/dietary-reference-intakes/tables/reference-values-macronutrients.html" target="_blank" rel="noreferrer">Health Canada DRI reference tables ↗</a></p>');return;}
 if(a==='open-log'){modal(`<span class="eyebrow">QUICK LUNCH CHECK-IN</span><h2>How did lunch feel?</h2><p>Log one serving of ${meals[state.lunch].name}. Estimates can be refined in a future version.</p><div class="feedback-options"><button class="secondary" data-action="log" data-value="satisfied">☺ Comfortably satisfied</button><button class="secondary" data-action="log" data-value="hungry">Still a little hungry</button><button class="secondary" data-action="log" data-value="too-much">A little too full</button></div><p class="fine">Selecting feedback saves this meal and updates your dashboard.</p>`);return;}
 if(a==='export'){const blob=new Blob([JSON.stringify({disclosure:'Synthetic NutriLife demo only',...state,nutrition:totals(state)},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='nutrilife-demo-progress.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Synthetic progress exported.');return;}
 if(a==='log')document.querySelector('#detail').close();act(a,v);
 if(a==='approve')notify('Approved. Lunch and in-app reminder updated together.');if(a==='log')notify('Lunch logged once. Dashboard updated.');if(a==='water')notify('One glass recorded.');
});
window.addEventListener('hashchange',()=>{if(location.hash==='#today'){view='today';render();}});
render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
